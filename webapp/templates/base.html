<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUI Research Agents</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [{left: '\\\\(', right: '\\\\)', display: false}]});"></script>
    <style>
        {{ pygments_css | safe }}
    </style>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong><a href="/">TUI Research Agents</a></strong></li>
            </ul>
            <ul>
                <li><a href="/">Papers</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container">
        <small>TUI Research Agents — Web Viewer</small>
    </footer>
</body>
</html>
