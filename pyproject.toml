[project]
name = "tui_agents"
version = "0.1.0"
description = "TUI app for managing LLM agents that collect, distill, implement, and prototype research papers"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.50.0",
    "openai>=1.30.0",
    "chromadb>=0.4.22",
    "aiosqlite>=0.20.0",
    "pydantic>=2.5.0",
    "arxiv>=2.0.0",
    "pypdf>=4.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tui_agents"]

[project.scripts]
tui-agents = "tui_agents.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "tui: marks tests that require Textual headless mode",
]
